            border: none;

        let currentLesson = 0;
        let correctAnswers = 0;

        function renderNavigation() {
            const sidebar = document.getElementById('sidebar');
            sidebar.innerHTML = '';
            
            lessons.forEach((lesson, index) => {
                const item = document.createElement('div');
                item.className = `nav-item ${index === currentLesson ? 'active' : ''}`;
                item.innerHTML = `
                    <div class="nav-title">第 ${lesson.id} 章: ${lesson.title}</div>
                    <div class="nav-desc">${lesson.description}</div>
                `;
                item.addEventListener('click', () => loadLesson(index));
                sidebar.appendChild(item);
            });
        }

        function loadLesson(index) {
            currentLesson = index;
            const content = document.getElementById('lessonContent');
            content.innerHTML = lessons[index].content;
            
            renderNavigation();
            updateProgress();
            initQuiz();
        }

        function updateProgress() {
            const progress = ((currentLesson + 1) / lessons.length) * 100;
            document.getElementById('progressFill').style.width = `${progress}%`;
            document.getElementById('progressText').textContent = `${correctAnswers}/${lessons.length}`;
        }

        function initQuiz() {
            const quizOptions = document.querySelectorAll('.quiz-option');
            quizOptions.forEach(option => {
                option.addEventListener('click', function() {
                    checkAnswer(this);
                });
            });
        }

        function checkAnswer(option) {
            const isCorrect = option.dataset.correct === 'true';
            const quizId = option.parentElement.id;
            const feedback = document.getElementById(`${quizId}Feedback`);
            
            document.querySelectorAll('.quiz-option').forEach(opt => {
                opt.classList.remove('selected');
                if (opt.dataset.correct === 'true') {
                    opt.classList.add('correct');
                } else if (opt.classList.contains('selected') && !isCorrect) {
                    opt.classList.add('wrong');
                }
            });
            
            option.classList.add('selected');
            
            if (isCorrect) {
                feedback.textContent = '✅ 回答正确！';
                feedback.className = 'quiz-feedback correct';
                if (!option.dataset.answered) {
                    correctAnswers++;
                    option.dataset.answered = 'true';
                    updateProgress();
                }
            } else {
                feedback.textContent = '❌ 回答错误，再想想！';
                feedback.className = 'quiz-feedback wrong';
            }
            feedback.style.display = 'block';
        }

        function resetEditor() {
            const editor = document.getElementById('editor');
            const lesson = lessons[currentLesson];
            const match = lesson.content.match(/<textarea id="editor">([\s\S]*?)<\/textarea>/);
            if (match) {
                editor.value = match[1].trim();
            }
        }

        async function runCode() {
            const editor = document.getElementById('editor');
            const output = document.getElementById('output');
            
            try {
                const response = await fetch('/api/execute', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ code: editor.value })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    output.innerHTML = result.output.map(line => 
                        `<div class="output-success">▶ ${line}</div>`
                    ).join('');
                } else {
                    output.innerHTML = `<div class="output-error">❌ ${result.error || result.output.join('\n')}</div>`;
                }
            } catch (error) {
                output.innerHTML = `<div class="output-error">❌ 网络错误: ${error.message}</div>`;
            }
        }

        function nextLesson() {
            if (currentLesson < lessons.length - 1) {
                loadLesson(currentLesson + 1);
            }
        }

        function prevLesson() {
            if (currentLesson > 0) {
                loadLesson(currentLesson - 1);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadLesson(0);
        });

        window.nextLesson = nextLesson;
        window.prevLesson = prevLesson;
        window.resetEditor = resetEditor;
        window.runCode = runCode;
    </script>
